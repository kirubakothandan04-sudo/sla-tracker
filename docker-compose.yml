services:
  postgres:
    image: postgres:16-alpine
    container_name: sla-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sla_user
      POSTGRES_PASSWORD: sla_password
      POSTGRES_DB: sla_tracker
    ports:
      - "5432:5432"
    volumes:
      - sla_tracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sla_user -d sla_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sla_tracker_postgres_data:
